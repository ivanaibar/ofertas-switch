name: Actualizar ofertas y publicar web

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main, master]
    paths:
      - '*.py'
      - '.github/workflows/ofertas.yml'

permissions:
  contents: read

concurrency:
  group: ofertas-pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Comprobar scraper
        run: python -m unittest -v
      - name: Recuperar historial
        run: |
          mkdir -p resultados data
          if [ -f data/historial.sqlite ]; then
            cp data/historial.sqlite resultados/historial.sqlite
          fi
      - name: Comprobar si los datos incluyen carátulas
        id: datos
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import urlopen
          snapshot = Path('data/productos.json')
          if snapshot.exists():
              data = json.loads(snapshot.read_text(encoding='utf-8'))
          else:
              with urlopen('https://ivanaibar.github.io/ofertas-switch/productos.json',timeout=30) as response:
                  data = json.load(response)
          refresh = os.environ['EVENT_NAME'] != 'push' or not data.get('productos') or any('imagen' not in product for product in data['productos'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('refresh=' + str(refresh).lower(), file=output)
          PY
      - name: Consultar categorías disponibles
        id: scrape
        if: steps.datos.outputs.refresh == 'true'
        # El código 2 solo se acepta si Preparar web valida el límite conocido.
        run: |
          python - <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.executable, 'scraper.py', '--salida', 'resultados', '--max-paginas', '200', '--pausa', '3'])
          if result.returncode not in (0, 2):
              sys.exit(result.returncode)
          PY
      - name: Regenerar presentación con la última consulta
        if: steps.datos.outputs.refresh != 'true'
        run: python renderizar_web.py
      - name: Preparar web
        run: python preparar_web.py --origen resultados --destino public --permitir-limite-catalogo
      - name: Conservar historial para siguientes ejecuciones
        if: steps.scrape.outcome == 'success'
        run: |
          cp resultados/historial.sqlite data/historial.sqlite
          cp resultados/productos.json data/productos.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/historial.sqlite data/productos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar historial de precios'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
